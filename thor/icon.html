<!doctype html><html><head><style>
html,body{margin:0;padding:0;background:transparent;}
.tile{width:512px;height:512px;border-radius:112px;overflow:hidden;
 background:radial-gradient(circle at 50% 38%, #3a2a6e 0%, #1b1440 55%, #0d0a22 100%);
 display:flex;align-items:center;justify-content:center;position:relative;}
.tile::after{content:"";position:absolute;inset:0;border-radius:112px;box-shadow:inset 0 0 0 6px rgba(255,255,255,0.08);}
img{width:400px;height:400px;filter:drop-shadow(0 10px 18px rgba(0,0,0,0.55));}
</style></head><body><div class="tile"><img src="scummvm.svg"></div></body></html>
